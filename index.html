<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A log of repositories worth remembering.">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">Personal collection</p>
        <h1>Stargazers log</h1>
        <p class="intro">A small record of the repositories that earned a place in my toolkit.</p>
      </header>
      <section class="repository-section" aria-labelledby="repository-heading">
        <div class="section-heading">
          <h2 id="repository-heading">Starred repositories</h2>
          <span id="repository-count" class="repository-count" aria-live="polite"></span>
        </div>
        <p id="status" class="status" role="status">Loading repositories...</p>
        <ul id="repository-list" class="repository-list" aria-label="Starred repositories"></ul>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
